name: Import Umi-OCR source
on:
  push:
    paths:
      - '.github/workflows/import-umi-ocr.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream source
        run: |
          git clone --depth 1 https://github.com/hiroi-sora/Umi-OCR.git /tmp/umi-ocr
          rm -rf /tmp/umi-ocr/.git
          rm -f /tmp/umi-ocr/Umi-OCR_Rapid_v2.1.5.7z
          mkdir -p Umi-OCR
          cp -a /tmp/umi-ocr/. Umi-OCR/
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Umi-OCR
          if git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "Import Umi-OCR source snapshot"; git push; fi
